<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Center filled hexagon (honeycomb) -->
  <polygon points="50,20 70,30 70,50 50,60 30,50 30,30" fill="#D4AF37" stroke="#B8860B" stroke-width="1"/>

  <!-- Surrounding hexagons outline only -->
  <polygon points="70,30 90,40 90,60 70,70 50,60 70,50" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <polygon points="30,30 50,20 70,30 50,40 30,50" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <polygon points="10,40 30,30 50,40 30,50 10,60" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <polygon points="30,50 50,60 30,70 10,60" fill="none" stroke="#D4AF37" stroke-width="1.5"/>
  <polygon points="50,60 70,70 50,80 30,70" fill="none" stroke="#D4AF37" stroke-width="1.5"/>

  <!-- Center dot -->
  <circle cx="50" cy="45" r="6" fill="#B8860B"/>
</svg>
