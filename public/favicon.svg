<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="48" fill="#FDB913" opacity="0.1"/>

  <!-- Honeycomb hexagons -->
  <g stroke="#D4AF37" stroke-width="2" fill="none">
    <!-- Center hexagon (larger) -->
    <polygon points="50,25 65,33 65,50 50,58 35,50 35,33" fill="#FDB913" opacity="0.3"/>

    <!-- Surrounding hexagons -->
    <polygon points="50,25 65,33 65,50 50,58 35,50 35,33"/>
    <polygon points="65,33 80,41 80,58 65,66 50,58 65,50"/>
    <polygon points="35,33 50,25 65,33 50,41 35,50"/>
    <polygon points="20,41 35,33 50,41 35,50 20,58"/>
    <polygon points="35,50 50,58 35,66 20,58"/>
    <polygon points="50,58 65,66 50,74 35,66"/>
  </g>

  <!-- Korean text "꿀" (honey) in center -->
  <text x="50" y="56" font-size="32" font-weight="bold" text-anchor="middle" dominant-baseline="central" fill="#D4AF37" font-family="Arial, sans-serif">꿀</text>
</svg>
